];
const COPS=[

  {n:"Receipt Guy",img:"receiptguy",e:"🥸",pay:0,pt:3.2,line:"do you take card? for uh, evidence.",cop:true},
];
const CHARGES=["selling oregano without a license","possession of excessive hopium","running an unlicensed taco front","criminal misuse of anime branding","laundering cash through snacks","wearing Bitcoin glasses with intent to deceive","weaponized hopium distribution"];

const VW=540, VH=960;
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
canvas.width=VW; canvas.height=VH;
function fit(){ const r=Math.min(window.innerWidth/VW, window.innerHeight/VH); canvas.style.width=(VW*r)+'px'; canvas.style.height=(VH*r)+'px'; }
addEventListener('resize',fit); fit();
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
function buzz(p){ if(navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

/* ---------------- Audio ---------------- */
const Sound=(()=>{
  let actx=null,muted=false,sg=null,bgm=null;
  function ensure(){ if(actx) return; actx=new (window.AudioContext||window.webkitAudioContext)(); sg=actx.createGain(); sg.gain.value=0.3; sg.connect(actx.destination); }
  function ensureBgm(){ if(bgm) return; bgm=document.createElement('audio'); bgm.src=CONFIG.MUSIC_FILE; bgm.loop=true; bgm.volume=0.55; bgm.muted=muted; }
  function tone(f,d,t,v=1){ if(!actx||muted) return; const o=actx.createOscillator(),g=actx.createGain(); o.type=t; o.frequency.value=f; g.gain.setValueAtTime(0.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(v,actx.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d); o.connect(g); g.connect(sg); o.start(); o.stop(actx.currentTime+d+0.02); }
  function slide(f1,f2,d,t,v=1){ if(!actx||muted) return; const o=actx.createOscillator(),g=actx.createGain(); o.type=t; o.frequency.setValueAtTime(f1,actx.currentTime); o.frequency.linearRampToValueAtTime(f2,actx.currentTime+d); g.gain.setValueAtTime(v,actx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d); o.connect(g); g.connect(sg); o.start(); o.stop(actx.currentTime+d+0.02); }
  return {
    resume(){ ensure(); if(actx.state==='suspended') actx.resume(); },
    startMusic(){ ensureBgm(); bgm.muted=muted; const p=bgm.play(); if(p&&p.catch) p.catch(()=>{}); },
    restartMusic(){ ensureBgm(); bgm.muted=muted; try{ bgm.pause(); bgm.currentTime=0; }catch(e){}
      const go=()=>{ try{bgm.currentTime=0;}catch(e){} const p=bgm.play(); if(p&&p.catch) p.catch(()=>{}); };
      if(bgm.readyState>=2) go(); else bgm.addEventListener('canplay',go,{once:true}); go(); },
    stopMusic(){ if(bgm) bgm.pause(); },
    setMuted(m){ muted=m; if(bgm) bgm.muted=m; }, isMuted(){ return muted; },
    cash(){ tone(740,0.05,'square',0.4); setTimeout(()=>tone(1100,0.1,'square',0.35),50); setTimeout(()=>tone(520,0.12,'sine',0.25),120); },
    upsell(){ [520,700,920,1200].forEach((f,i)=>setTimeout(()=>tone(f,0.08,'square',0.35),i*45)); },
    nope(){ slide(220,120,0.18,'sawtooth',0.4); },
    dodge(){ tone(400,0.08,'sine',0.3); setTimeout(()=>tone(600,0.1,'sine',0.3),80); },
    scratch(){ slide(900,200,0.14,'sawtooth',0.4); },
    warn(){ tone(1000,0.08,'square',0.25); },
    event(){ tone(880,0.1,'triangle',0.35); },
    siren(){ let up=true; for(let i=0;i<6;i++) setTimeout(()=>{ slide(up?700:1100,up?1100:700,0.22,'square',0.4); up=!up; },i*220); },
    gamble(){ [400,500,600,700,800].forEach((f,i)=>setTimeout(()=>tone(f,0.05,'square',0.3),i*40)); },
    bust(){ slide(400,80,0.5,'sawtooth',0.6); setTimeout(()=>{ slide(700,1100,0.25,'square',0.4); setTimeout(()=>slide(1100,700,0.25,'square',0.4),250); },200); },
    win(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.24,'square',0.5),i*130)); },
  };
})();
document.getElementById('mute').addEventListener('click',e=>{ const m=!Sound.isMuted(); Sound.setMuted(m); e.target.textContent='SOUND: '+(m?'OFF':'ON'); e.target.style.color=m?'#666':'#16c784'; e.target.style.borderColor=m?'#666':'#16c784'; });

/* ---------------- Input ---------------- */
function cpoint(e){ const r=canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)*(VW/r.width), y:(e.clientY-r.top)*(VH/r.height)}; }
canvas.addEventListener('pointerdown',e=>{ Sound.resume(); const p=cpoint(e);
  if(state==='title'){ handleTitleClick(p.x,p.y); return; }
  if(state==='over'){ handleEndClick(p.x,p.y); return; }
  if(state==='play') handlePlayClick(p.x,p.y);
});
addEventListener('keydown',e=>{ if(state==='title'){ if(e.code==='Space'){ Sound.resume(); startGame(); } return; }
  if(state==='over') return;
  if(fbiActive||!cust||cust.mimic||phase!=='wait') return;
  if(e.code==='Digit1') act('sell'); else if(e.code==='Digit2') act('upsell'); else if(e.code==='Digit3') act('refuse'); else if(e.code==='Space'){ e.preventDefault(); act('lay'); } });

/* ---------------- State ---------------- */
let state='title', last=0, elapsed=0, timeLeft=60;
let money, heat, streak, served, copsFooled, bestStreak, highHeat;
let cust, phase, mode, resultT, resultTxt, resultCol, gapT;
let evt, evtT, evtName, floaters, spectators, busted, charge, lastEvtT;
let shake=0, copScratch=0, warnT=0;
let fbiActive=false, fb={}, phoneUsed=false, fbiSch=[], fbiIdx=0;
let jimSch=[], jimIdx=0, jimT=0, jimAmt=0, mimicSch=[], mimicIdx=0;
let bt={}, mb={}, endBtns={}, titleBtns={};

function reset(){
  elapsed=0; timeLeft=CONFIG.RUN_SECONDS; money=0; heat=0; streak=0; served=0; copsFooled=0; bestStreak=0; highHeat=0;
  cust=null; phase='gap'; mode='normal'; gapT=0.4; resultT=0; resultTxt=''; resultCol='#16c784';
  evt=null; evtT=0; evtName=''; lastEvtT=6; floaters=[]; busted=false; charge=''; warnT=0;
  spectators=Array.from({length:4},(_,i)=>({x:44+i*150,e:['🧍','🧎','🐀','🧍‍♂️'][i],ph:Math.random()*6}));
  shake=0; copScratch=0; fbiActive=false; phoneUsed=false; jimT=0;
  fbiSch=[12+Math.random()*14, 36+Math.random()*16]; fbiIdx=0;   // FBI raid pops up at most twice
  jimSch=[15+Math.random()*15, 30+Math.random()*15]; jimIdx=0;   // ~2 strikes, in 15-30s & 30-45s
  mimicSch=[10+Math.random()*20]; if(Math.random()<0.6) mimicSch.push(40+Math.random()*20); mimicIdx=0;  // 1st mimic @10-30s, optional 2nd @40-60s
}
function startGame(){ reset(); state='play'; Sound.restartMusic(); }

function streakMult(){ return 1+Math.min(streak,10)*0.1; }
function payMult(){ return evt==='bull'?1.8 : evt==='influencer'?1.5 : evt==='bear'?0.5 : 1; }
function pushWin(){ return heat>=5?0.50 : heat>=4?0.65 : 0.80; }

function pickCustomer(){ let tot=0; for(const c of CUSTOMERS) tot+=(c.w||1); let r=Math.random()*tot; for(const c of CUSTOMERS){ r-=(c.w||1); if(r<=0) return c; } return CUSTOMERS[0]; }
function spawnEncounter(forceMimic){
  const copChance=0.10+heat*0.05;
  let arch, mimic=false;
  if(forceMimic){ arch=Object.assign({},pickCustomer()); mimic=true; }
  else if(Math.random()<copChance){ arch=COPS[Math.floor(Math.random()*COPS.length)]; }
  else arch=pickCustomer();
  const prod=PRODUCTS[Math.floor(Math.random()*PRODUCTS.length)];
  cust={arch,prod,pt:(arch.pt||3),maxpt:(arch.pt||3),x:VW+160,cop:!!arch.cop,mimic}; phase='wait'; mode=mimic?'mimic':'normal';
  if(arch.cop){ Sound.scratch(); copScratch=0.5; }
}

/* ---------------- Actions ---------------- */
function arrived(){ return cust && cust.x<=VW*0.62; }
function act(kind){ if(state!=='play'||fbiActive||phase!=='wait'||!arrived()||cust.mimic) return;
  const a=cust.arch, p=cust.prod;
  if(kind==='sell'||kind==='upsell'){
    if(cust.cop){ resolve('🚔 IT WAS A COP!','#ea3943'); floaters.push({x:VW/2,y:VH*0.34,txt:'🚨 STING! 🚨',c:'#ea3943',life:1.1}); Sound.bust(); busted=true; setTimeout(()=>doBust(),500); return; }
    const up=kind==='upsell'; const pay=Math.round(p.v*a.pay*(up?2:1)*payMult()*streakMult());
    money+=pay; served++; streak++; bestStreak=Math.max(bestStreak,streak);
    heat=Math.min(CONFIG.HEAT_MAX, heat+(up?0.8:0.42)+(evt==='influencer'?0.25:0)+streak*0.02);
    if(up) Sound.upsell(); else Sound.cash(); buzz(15);
    floaters.push({x:VW/2,y:VH*0.34,txt:'+$'+pay,c:'#16c784',life:1.1});
    resolve((up?'💰 UPSOLD! ':'💵 SOLD! ')+p.fx,'#f9c80e');
  } else if(kind==='refuse'){
    if(cust.cop){ copsFooled++; heat=Math.max(0,heat-0.5); streak=0; Sound.dodge(); floaters.push({x:VW/2,y:VH*0.34,txt:'DODGED 🚔',c:'#4de1ff',life:1.1}); resolve('smart — that was a cop. 😮‍💨','#4de1ff'); }
    else { streak=0; heat=Math.max(0,heat-0.1); Sound.nope(); resolve('they storm off annoyed. 🙄','#9fb3c8'); }
  } else if(kind==='lay'){
    heat=Math.max(0,heat-1.4); streak=0; Sound.dodge(); floaters.push({x:VW/2,y:VH*0.58,txt:'laying low 🚬',c:'#4de1ff',life:1.1});
    resolve('you chill behind the dumpster. 😎','#4de1ff');
  }
}
function pushIt(){ if(state!=='play'||fbiActive||phase!=='wait'||!arrived()||cust.mimic||heat<3) return;
  Sound.gamble(); const a=cust.arch,p=cust.prod;
  const win=Math.random()<pushWin();
  if(cust.cop || !win){ resolve('🚔 PUSHED TOO HARD — BUSTED!','#ea3943'); floaters.push({x:VW/2,y:VH*0.34,txt:'💥 CAUGHT',c:'#ea3943',life:1.1}); Sound.bust(); busted=true; setTimeout(()=>doBust(),500); return; }
  const pay=Math.round((p.v*Math.max(a.pay,1)*3)*payMult()*streakMult());
  money+=pay; served++; streak+=2; bestStreak=Math.max(bestStreak,streak);
  heat=Math.min(CONFIG.HEAT_MAX,heat+0.6);
  Sound.cash(); buzz(25); floaters.push({x:VW/2,y:VH*0.30,txt:'🎲 +$'+pay+'!',c:'#f9c80e',life:1.3});
  resolve('🔥 BIG DEAL PAID OFF! '+p.fx,'#f9c80e');
}
function mimicBribe(){ if(state!=='play'||fbiActive||phase!=='wait'||!arrived()||!cust.mimic) return;
  const cost=Math.max(50,Math.round(money*0.25)); money=Math.max(0,money-cost); streak=0; heat=Math.max(0,heat-0.4);
  Sound.dodge(); floaters.push({x:VW/2,y:VH*0.34,txt:'-$'+cost+' 🤝',c:'#4de1ff',life:1.2});
  resolve('you slip them cash. they vanish. 🫡','#4de1ff');
}
function mimicRisk(){ if(state!=='play'||fbiActive||phase!=='wait'||!arrived()||!cust.mimic) return;
  Sound.gamble(); if(Math.random()<0.5){ heat=Math.max(0,heat-0.3); streak++; const bonus=Math.round(60*streakMult()); money+=bonus;
    floaters.push({x:VW/2,y:VH*0.34,txt:'GOT AWAY +$'+bonus,c:'#16c784',life:1.2}); resolve('you called their bluff. 😎','#16c784'); }
  else { resolve('🚔 IT WAS A COP! BUSTED!','#ea3943'); floaters.push({x:VW/2,y:VH*0.34,txt:'🚨 STING',c:'#ea3943',life:1.1}); Sound.bust(); busted=true; setTimeout(()=>doBust(),500); }
}
function startFBI(){ fbiActive=true; cust=null; phase='gap'; Sound.siren(); buzz([40,60,40]); shake=8; }
function endFBI(){ fbiActive=false; phase='gap'; gapT=0.5; }
function fbiPhone(){ if(!fbiActive||phoneUsed) return; phoneUsed=true; heat=Math.max(0,heat-3); Sound.dodge(); floaters.push({x:VW/2,y:VH*0.5,txt:'📞 SAVED!',c:'#16c784',life:1.3}); resolve('a friend pulls up. you slip out back. 😤','#16c784'); endFBI(); }
function fbiBribe(){ if(!fbiActive) return; const cost=Math.max(100,Math.round(money*0.30)); money=Math.max(0,money-cost); heat=Math.max(0,heat-2); Sound.dodge(); floaters.push({x:VW/2,y:VH*0.5,txt:'-$'+cost+' 💸',c:'#4de1ff',life:1.3}); resolve('you buy your way out. 🫡','#4de1ff'); endFBI(); }
function fbiRun(){ if(!fbiActive) return; Sound.gamble(); if(Math.random()<0.5){ heat=Math.max(0,heat-3); streak=0; floaters.push({x:VW/2,y:VH*0.5,txt:'🏃 ESCAPED!',c:'#16c784',life:1.3}); resolve('you sprint down the alley. 😤','#16c784'); endFBI(); }
  else { fbiActive=false; resolve('🚔 THEY GOT YOU!','#ea3943'); Sound.bust(); busted=true; setTimeout(()=>doBust(),500); } }

function jimothyStrike(){ const steal=Math.max(10,Math.round(money*0.22)); money=Math.max(0,money-steal); jimAmt=steal; jimT=1.7; streak=0; Sound.scratch(); buzz(70); floaters.push({x:VW/2,y:VH*0.30,txt:'-$'+steal+' 🐱💨',c:'#ea3943',life:1.4}); }

function resolve(txt,col){ resultTxt=txt; resultCol=col; phase='result'; resultT=0.95; if(cust) cust.leaving=true; highHeat=Math.max(highHeat,heat); }
function customerTimeout(){ streak=0; Sound.nope(); resolve(cust.cop?'the cop wanders off... 🚶':(cust.mimic?'they got suspicious and left. 👀':'"is the cat frozen??" they bail. 💤'),'#9fb3c8'); }

function doBust(){ busted=true; charge=CHARGES[Math.floor(Math.random()*CHARGES.length)]; state='over'; Sound.stopMusic(); }
function doSurvive(){ busted=false; state='over'; Sound.stopMusic(); Sound.win(); }

function shareText(){ const url=CONFIG.SITE_URL; const paws='🐾'.repeat(Math.max(1,Math.round(highHeat)));
  if(busted) return `I got caught by the police 😿\n\nBusted for $${money} of definitely legal product 💨\n\nWanted level: ${paws}\n\nSlang that catnip 👇\n\n${url}`;
  return `I ran the CATNIP CARTEL 🐱💰\n\n$${money} of definitely-legal product to ${served} degens 💨\n\nWanted level: ${paws}\n\nSlang that catnip 👇\n\n${url}`; }
function shareURL(){ return 'https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText()); }
function shareNow(){ const webUrl=shareURL();
  if(isTouch){ const appUrl='twitter://post?message='+encodeURIComponent(shareText()); let opened=false; const onHide=()=>{opened=true;};
    document.addEventListener('visibilitychange',onHide,{once:true}); window.location.href=appUrl;
    setTimeout(()=>{ document.removeEventListener('visibilitychange',onHide); if(!opened) window.open(webUrl,'_blank'); },800);
  } else window.open(webUrl,'_blank'); }

/* ---------------- Update ---------------- */
function update(dt){
  if(shake>0) shake=Math.max(0,shake-dt*40); if(copScratch>0) copScratch-=dt; if(warnT>0) warnT-=dt; if(jimT>0) jimT-=dt;
  floaters.forEach(f=>{ f.y-=46*dt; f.life-=dt; }); floaters=floaters.filter(f=>f.life>0);
  spectators.forEach(s=>s.ph+=dt*3);
  if(fbiActive) return; // raid modal pauses the clock

  elapsed+=dt; timeLeft-=dt;
  if(timeLeft<=0){ timeLeft=0; if(!busted) doSurvive(); return; }
  if(heat>=CONFIG.HEAT_MAX && !busted){ busted=true; Sound.bust(); setTimeout(()=>doBust(),300); return; }
  if(heat>=3 && warnT<=0){ warnT=0.9; Sound.warn(); }
  // Jimothy: ~2 scheduled strikes across the run
  if(jimIdx<jimSch.length && elapsed>=jimSch[jimIdx]){ jimIdx++; if(money>15 && !busted) jimothyStrike(); }

  if(elapsed>lastEvtT && !evt){ const opts=['bull','influencer','driveby','bear']; const e=opts[Math.floor(Math.random()*opts.length)];
    if(e==='driveby'){ heat=Math.min(CONFIG.HEAT_MAX,heat+0.9); evtName='🚓 POLICE DRIVE-BY!'; evt='driveby'; evtT=2.2; }
    else { evt=e; evtT=7; evtName= e==='bull'?'📈 BULL MARKET — everyone overpays!' : e==='influencer'?'🤳 INFLUENCER LIVE — 1.5x cash, +heat!' : '📉 BEAR MARKET — cheapskates only'; }
    Sound.event(); lastEvtT=elapsed+7+Math.random()*6;
  }
  if(evt){ evtT-=dt; if(evtT<=0) evt=null; }

  if(phase==='wait' && cust){ if(cust.x>VW*0.5) cust.x+=(VW*0.5-cust.x)*Math.min(1,dt*6); else { cust.x=VW*0.5; cust.pt-=dt; if(cust.pt<=0) customerTimeout(); } }
  else if(phase==='result'){ resultT-=dt; if(cust) cust.x+=440*dt; if(resultT<=0 && !busted){ cust=null; phase='gap'; gapT=0.22; } }
  else if(phase==='gap'){ gapT-=dt; if(gapT<=0){
      if(fbiIdx<fbiSch.length && elapsed>=fbiSch[fbiIdx]){ fbiIdx++; startFBI(); }
      else if(mimicIdx<mimicSch.length && elapsed>=mimicSch[mimicIdx]){ mimicIdx++; spawnEncounter(true); }
      else spawnEncounter(false); } }
}

/* ---------------- Draw helpers ---------------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawFace(cx,cy,size,arch,ringCol){ const im=arch&&arch.img?IMG[arch.img]:null; const s=size, x=cx-s/2, y=cy-s/2;
  if(ringCol){ ctx.fillStyle=ringCol; rr(x-5,y-5,s+10,s+10,16); ctx.fill(); }
  if(im&&im.complete&&im.naturalWidth>0){ ctx.save(); rr(x,y,s,s,14); ctx.clip(); ctx.drawImage(im,x,y,s,s); ctx.restore(); ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2; rr(x,y,s,s,14); ctx.stroke(); }
  else { ctx.font=Math.round(s*0.8)+'px '+F; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(arch?arch.e:'❓',cx,cy); ctx.textBaseline='alphabetic'; }
}
function linkBtn(b,stroke,label,fs){ ctx.fillStyle='rgba(255,255,255,0.05)'; rr(b.x,b.y,b.w,b.h,10); ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=2.5; rr(b.x,b.y,b.w,b.h,10); ctx.stroke(); ctx.fillStyle=stroke; ctx.font='900 '+(fs||17)+'px '+F; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,b.x+b.w/2,b.y+b.h/2+1); ctx.textBaseline='alphabetic'; }
function ctaBtn(b,fill,stroke,label,fs,glow){ if(glow){ ctx.save(); ctx.shadowColor=stroke; ctx.shadowBlur=16+7*Math.sin(performance.now()/160); } ctx.fillStyle=fill; rr(b.x,b.y,b.w,b.h,12); ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=3.5; rr(b.x,b.y,b.w,b.h,12); ctx.stroke(); if(glow) ctx.restore(); ctx.fillStyle='#fff'; ctx.font='900 '+(fs||22)+'px '+F; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(label,b.x+b.w/2,b.y+b.h/2+1); ctx.textBaseline='alphabetic'; }

/* ---------------- Draw scene ---------------- */
function drawAlley(){
  const g=ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,'#0c1030'); g.addColorStop(1,'#161022'); ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  if(heat>1.5){ const a=Math.min(0.28,(heat-1.5)*0.09); const bl=Math.floor(performance.now()/280)%2; ctx.fillStyle=bl?`rgba(60,80,255,${a})`:`rgba(255,50,60,${a})`; ctx.fillRect(0,0,VW,VH); }
  ctx.fillStyle='#0a0812'; ctx.fillRect(0,VH*0.72,VW,VH*0.28);
  ctx.fillStyle='#1f6f4a'; ctx.fillRect(18,VH*0.60,120,96); ctx.fillStyle='#134a31'; ctx.fillRect(18,VH*0.60,120,14);
  ctx.font='26px '+F; ctx.textAlign='left'; ctx.fillText('🍕',150,VH*0.70); ctx.fillText('🗑️',VW-72,VH*0.68); ctx.fillText('🌮',VW-118,VH*0.71);
  ctx.fillStyle='rgba(255,106,213,0.4)'; ctx.font='900 20px '+F; ctx.fillText('WAGMI',40,VH*0.585);
  spectators.forEach(s=>{ ctx.font='26px '+F; ctx.textAlign='center'; ctx.globalAlpha=0.5; ctx.fillText(s.e,s.x,VH*0.70+Math.sin(s.ph)*3); ctx.globalAlpha=1; });
  const vg=ctx.createRadialGradient(VW/2,VH*0.5,VH*0.28,VW/2,VH*0.5,VH*0.66); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.5)'); ctx.fillStyle=vg; ctx.fillRect(0,0,VW,VH);
}
function drawCat(){ const x=VW*0.5, y=VH*0.65, bob=Math.sin(performance.now()/500)*3;
  ctx.save(); ctx.translate(x,y+bob);
  ctx.fillStyle='#caa24a'; ctx.beginPath(); ctx.ellipse(0,38,58,44,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#7a5a10'; for(let i=0;i<8;i++){ ctx.beginPath(); ctx.arc(-38+i%4*24,20+Math.floor(i/4)*24,5,0,7); ctx.fill(); }
  ctx.fillStyle='#8a8f99'; ctx.beginPath(); ctx.arc(0,-16,34,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30,-38); ctx.lineTo(-16,-58); ctx.lineTo(-6,-38); ctx.closePath(); ctx.moveTo(30,-38); ctx.lineTo(16,-58); ctx.lineTo(6,-38); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#111'; ctx.fillRect(-28,-24,56,15); ctx.fillStyle='#f7931a'; ctx.font='900 15px '+F; ctx.textAlign='center'; ctx.fillText('₿',-15,-12); ctx.fillText('₿',15,-12);
  ctx.strokeStyle='#cfd3da'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(7,-3); ctx.lineTo(34,-8); ctx.moveTo(7,2); ctx.lineTo(34,4); ctx.moveTo(-7,-3); ctx.lineTo(-34,-8); ctx.moveTo(-7,2); ctx.lineTo(-34,4); ctx.stroke();
  ctx.fillStyle='#3a2020'; ctx.beginPath(); ctx.arc(0,2,4,0,Math.PI); ctx.fill();
  ctx.restore();
}
function drawChar(){ const im=IMG.dealer; if(im&&im.complete&&im.naturalWidth>0){ const bob=Math.sin(performance.now()/520)*4; drawFace(VW*0.5, VH*0.60+bob, 150, {img:'dealer'}, '#f9c80e'); } else drawCat(); }
function drawCustomer(){ if(!cust) return; const x=cust.x, y=VH*0.36, cop=cust.cop, mimic=cust.mimic;
  ctx.font='900 20px '+F; ctx.textAlign='center'; const line=cust.arch.line; const w=Math.min(VW-24,ctx.measureText(line).width+40);

  else if(mimic){ ctx.fillStyle=`rgba(249,200,14,${0.6+0.4*Math.sin(performance.now()/160)})`; ctx.font='900 16px '+F; ctx.fillText('😰 something feels OFF...',x,y-118); }
  drawFace(x,y-4,150,cust.arch, cop?'#ea3943':(mimic?'#f9c80e':null));
  ctx.fillStyle='#fff'; ctx.font='900 24px '+F; ctx.fillText(cust.arch.n,x,y+96);
  ctx.fillStyle='#f9c80e'; ctx.font='900 22px '+F; ctx.fillText('wants '+cust.prod.n+'  $'+cust.prod.v,x,y+126);
  if(cust.x<=VW*0.5+2 && !cust.leaving){ const pw=230, pf=Math.max(0,cust.pt/cust.maxpt); ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.fillRect(x-pw/2,y+140,pw,12);
    ctx.fillStyle=pf<0.3?'#ea3943':'#16c784'; ctx.fillRect(x-pw/2,y+140,pw*pf,12); }
}
function drawHUD(){
  ctx.textAlign='center'; ctx.fillStyle='#16c784'; ctx.font='900 56px '+F; ctx.fillText('$'+money,VW/2,58);
  ctx.textAlign='right'; ctx.fillStyle='#fff'; ctx.font='900 34px '+F; ctx.fillText(Math.ceil(timeLeft)+'s',VW-16,42);
  ctx.textAlign='left'; ctx.font='900 15px '+F; ctx.fillStyle=phoneUsed?'#555':'#4de1ff'; ctx.fillText(phoneUsed?'📞 used':'📞 1 call',16,42);
  ctx.textAlign='center'; ctx.fillStyle='#ff6a6a'; ctx.font='900 16px '+F; ctx.fillText('🚨 WANTED 🚨',VW/2,92);
  const base=30, spd=200-heat*22, pulse=1+(heat/CONFIG.HEAT_MAX)*0.55*Math.abs(Math.sin(performance.now()/spd));
  for(let i=0;i<CONFIG.HEAT_MAX;i++){ const on=i<Math.ceil(heat); const sc=on?pulse:1; const sz=Math.round(base*sc);
    ctx.globalAlpha=on?1:0.22; ctx.font=sz+'px '+F; ctx.fillText('🐾', VW/2-90+i*45, 128+(sz-base)*0.3); } ctx.globalAlpha=1;
  if(heat>=3){ const big=heat>=4.2; ctx.fillStyle=`rgba(234,57,67,${0.6+0.4*Math.sin(performance.now()/120)})`; ctx.font='900 '+(big?24:19)+'px '+F;
    ctx.fillText(big?'🚨 ALMOST BUSTED — LAY LOW! 🚨':'🚨 COPS CIRCLING — LAY LOW 🚬',VW/2,158); }
  if(streak>=2){ ctx.fillStyle='#f9c80e'; ctx.font='900 18px '+F; ctx.fillText('🔥 STREAK x'+streak+'  ·  '+streakMult().toFixed(1)+'x cash',VW/2,VH*0.28); }
  if(evt){ ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,VH*0.185,VW,34); ctx.fillStyle='#f9c80e'; ctx.font='900 18px '+F; ctx.fillText(evtName,VW/2,VH*0.185+24); }
  if(phase==='result'){ ctx.font='900 22px '+F; ctx.textAlign='center'; const tw=Math.min(VW-24,ctx.measureText(resultTxt).width); const by=VH*0.44;
    ctx.fillStyle='rgba(6,6,16,0.85)'; rr(VW/2-tw/2-16,by-25,tw+32,38,10); ctx.fill(); ctx.strokeStyle=resultCol; ctx.lineWidth=2; rr(VW/2-tw/2-16,by-25,tw+32,38,10); ctx.stroke();
    ctx.fillStyle=resultCol; ctx.fillText(resultTxt,VW/2,by); }
  floaters.forEach(f=>{ ctx.globalAlpha=Math.min(1,f.life); ctx.fillStyle=f.c; ctx.font='900 34px '+F; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y); }); ctx.globalAlpha=1;
}
function drawBtn(b,fill,stroke,label,sub,glow){ if(glow){ ctx.save(); ctx.shadowColor=stroke; ctx.shadowBlur=18+8*Math.sin(performance.now()/150); } ctx.fillStyle=fill; rr(b.x,b.y,b.w,b.h,12); ctx.fill(); ctx.strokeStyle=stroke; ctx.lineWidth=4; rr(b.x,b.y,b.w,b.h,12); ctx.stroke(); if(glow) ctx.restore();
  ctx.fillStyle='#fff'; ctx.font='900 '+(b.h>90?36:30)+'px '+F; ctx.textAlign='center'; ctx.fillText(label,b.x+b.w/2,b.y+b.h/2+ (sub?-2:11)); if(sub){ ctx.font='900 16px '+F; ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillText(sub,b.x+b.w/2,b.y+b.h/2+23); } }
function drawButtons(){
  if(cust && cust.mimic && phase==='wait'){
    const cost=Math.max(50,Math.round(money*0.25));
    mb.bribe={x:16,y:VH-236,w:VW-32,h:100}; mb.risk={x:16,y:VH-124,w:VW-32,h:100};
    drawBtn(mb.bribe,'rgba(77,225,255,0.26)','#4de1ff','💸 BRIBE  -$'+cost,'bail out safe · keep hustling');
    drawBtn(mb.risk,'rgba(249,200,14,0.26)','#f9c80e','🎲 RISK IT  (50/50)','run for it — get away or BUSTED',true);
    bt={}; return;
  }
  const showPush = heat>=3 && phase==='wait' && cust && !cust.mimic;
  const y0=VH-236, bw=(VW-48)/2, bh=98, gap=14;
  if(showPush){ bt.push={x:16,y:VH-300,w:VW-32,h:64}; drawBtn(bt.push,'rgba(234,57,67,0.30)','#ea3943','🎲 PUSH IT — '+Math.round(pushWin()*100)+'% · 3x cash',null,true); } else bt.push=null;
  bt.sell={x:16,y:y0,w:bw,h:bh}; bt.upsell={x:16+bw+gap,y:y0,w:bw,h:bh};
  bt.refuse={x:16,y:y0+bh+gap,w:bw,h:bh}; bt.lay={x:16+bw+gap,y:y0+bh+gap,w:bw,h:bh};
  drawBtn(bt.sell,'rgba(22,199,132,0.3)','#16c784','💵 SELL','safe cash');
  drawBtn(bt.upsell,'rgba(249,200,14,0.26)','#f9c80e','💰 UPSELL','2x cash · +heat');
  drawBtn(bt.refuse,'rgba(120,130,150,0.24)','#9fb3c8','🙅 NAH','dodge cops');
  drawBtn(bt.lay,'rgba(77,225,255,0.24)','#4de1ff','🚬 LAY LOW','cool the heat');
  mb={};
}
function drawFBI(){
  ctx.fillStyle='rgba(4,2,10,0.86)'; ctx.fillRect(0,0,VW,VH); ctx.textAlign='center';
  drawFace(VW/2,VH*0.24,260,{img:'fbi'},null);
  ctx.fillStyle=`rgba(234,57,67,${0.7+0.3*Math.sin(performance.now()/120)})`; ctx.font='900 46px '+F; ctx.fillText('🚨 FBI RAID! 🚨',VW/2,VH*0.44);
  ctx.fillStyle='#fff'; ctx.font='900 20px '+F; ctx.fillText('they kicked in the door. move NOW.',VW/2,VH*0.475);
  const cost=Math.max(100,Math.round(money*0.30)); let y=VH*0.53; const bw=VW-56;
  if(!phoneUsed){ fb.phone={x:28,y:y,w:bw,h:84}; drawBtn(fb.phone,'rgba(22,199,132,0.3)','#16c784','📞 PHONE A FRIEND','1 per run · escape + keep cash',true); y+=98; } else fb.phone=null;
  fb.bribe={x:28,y:y,w:bw,h:84}; drawBtn(fb.bribe,'rgba(77,225,255,0.26)','#4de1ff','💸 BRIBE -$'+cost,'guaranteed escape'); y+=98;
  fb.run={x:28,y:y,w:bw,h:84}; drawBtn(fb.run,'rgba(234,57,67,0.30)','#ea3943','🏃 MAKE A RUN (50/50)','free — but you might get caught',true);
}
function drawJimothy(){ if(jimT<=0) return; const a=Math.min(1,jimT*1.6); ctx.save(); ctx.globalAlpha=a;
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,VH*0.30,VW,220);
  drawFace(VW*0.28,VH*0.30+110,170,{img:'jimothy'},'#ea3943');
  ctx.textAlign='left'; ctx.fillStyle='#ea3943'; ctx.font='900 40px '+F; ctx.fillText('JIMOTHY!',VW*0.44,VH*0.30+90);
  ctx.fillStyle='#fff'; ctx.font='900 22px '+F; ctx.fillText('swiped $'+jimAmt+' 🐱💨',VW*0.44,VH*0.30+128);
  ctx.fillStyle='#9fb3c8'; ctx.font='900 15px '+F; ctx.fillText('that little thief!',VW*0.44,VH*0.30+158);
  ctx.restore();
}
function handlePlayClick(x,y){ const hit=b=>b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
  if(fbiActive){ if(hit(fb.phone)) fbiPhone(); else if(hit(fb.bribe)) fbiBribe(); else if(hit(fb.run)) fbiRun(); return; }
  if(phase!=='wait'||!cust) return;
  if(cust.mimic){ if(hit(mb.bribe)) mimicBribe(); else if(hit(mb.risk)) mimicRisk(); return; }
  if(hit(bt.push)) pushIt(); else if(hit(bt.sell)) act('sell'); else if(hit(bt.upsell)) act('upsell'); else if(hit(bt.refuse)) act('refuse'); else if(hit(bt.lay)) act('lay');
}

/* ---------------- Title ---------------- */
function drawTitle(){ drawAlley();
  const fl=0.55+0.45*Math.abs(Math.sin(performance.now()/380));  // flashing
  ctx.textAlign='center'; ctx.save(); ctx.shadowColor='#f9c80e'; ctx.shadowBlur=22*fl;
  ctx.globalAlpha=fl; ctx.fillStyle='#f9c80e'; ctx.font='900 64px '+F; ctx.fillText('CATNIP',VW/2,78);
  ctx.shadowColor='#16c784'; ctx.fillStyle='#16c784'; ctx.font='900 64px '+F; ctx.fillText('CARTEL',VW/2,140);
  ctx.restore();
  const cbob=Math.sin(performance.now()/560)*5;
  drawFace(VW/2,300+cbob,236,{img:'dealer'},'#f9c80e');
  titleBtns.mint={x:36,y:452,w:VW-72,h:54}; ctaBtn(titleBtns.mint,'rgba(249,200,14,0.28)','#f9c80e','🐱 CUTIE KITTIES — FREE MINT LIVE',20,true);
  ctx.fillStyle='rgba(10,10,26,0.82)'; rr(36,528,VW-72,186,14); ctx.fill(); ctx.strokeStyle='#16c784'; ctx.lineWidth=2; rr(36,528,VW-72,186,14); ctx.stroke();
  ctx.textAlign='center'; ctx.font='900 19px '+F; let ly=566;
  ctx.fillStyle='#16c784'; ctx.fillText('💵 SELL / UPSELL — get paid',VW/2,ly); ly+=39;
  ctx.fillStyle='#ff9a9a'; ctx.fillText('🙅 NAH — dodge the 🚨 cops',VW/2,ly); ly+=39;
  ctx.fillStyle='#4de1ff'; ctx.fillText('🚬 LAY LOW — cool your 🐾 heat',VW/2,ly); ly+=39;
  ctx.fillStyle='#f9c80e'; ctx.fillText('🎲 PUSH IT — risky big money',VW/2,ly);
  ctx.fillStyle=`rgba(249,200,14,${0.5+0.5*Math.sin(performance.now()/300)})`; ctx.font='900 30px '+F; ctx.fillText(isTouch?'TAP TO START':'CLICK / SPACE TO START',VW/2,762);
}
function handleTitleClick(x,y){ const hit=b=>b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
  if(hit(titleBtns.mint)){ window.open(CONFIG.LINKS.mint,'_blank'); return; }
  startGame();
}

/* ---------------- Game over ---------------- */
function drawOver(){ drawAlley(); ctx.fillStyle='rgba(6,4,14,0.9)'; ctx.fillRect(0,0,VW,VH); ctx.textAlign='center';
  const now=performance.now();
  if(busted){ const bl=Math.floor(now/250)%2; ctx.fillStyle=bl?'rgba(60,80,255,0.12)':'rgba(255,50,60,0.12)'; ctx.fillRect(0,0,VW,VH); }
  else { ctx.font='30px '+F; for(let i=0;i<16;i++){ const x=(i*61+now*0.03*((i%3)+1))%(VW+40)-20; const y=(now*0.12*((i%4)+1)+i*80)%(VH+40)-20; ctx.globalAlpha=0.45; ctx.fillText('💵',x,y); } ctx.globalAlpha=1; }
  ctx.save(); ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=8;
  if(busted){ ctx.fillStyle='#ea3943'; ctx.font='900 52px '+F; ctx.fillText('BUSTED 🚔',VW/2,90);
    drawFace(VW/2,240,220,{img:'busted'},'#ea3943');
    ctx.fillStyle='#ff9a9a'; ctx.font='900 16px '+F; ctx.fillText('charged with '+charge,VW/2,384);
  } else { ctx.fillStyle='#16c784'; ctx.font='900 48px '+F; ctx.fillText('GOT AWAY! 🐱💰',VW/2,90);
    drawFace(VW/2,240,220,{img:'gotaway'},'#16c784'); ctx.fillStyle='#cfd6e0'; ctx.font='900 16px '+F; ctx.fillText('cashed out clean, kitty 😼',VW/2,384); }
  ctx.restore();
  ctx.fillStyle='#fff'; ctx.font='900 66px '+F; ctx.fillText('$'+money,VW/2,452);
  ctx.fillStyle='#9fb3c8'; ctx.font='900 17px '+F; ctx.fillText(served+' customers  ·  heat '+'🐾'.repeat(Math.max(1,Math.round(highHeat))),VW/2,484);
  // BIG noticeable share button
  endBtns.share={x:28,y:516,w:VW-56,h:70}; ctaBtn(endBtns.share,'rgba(29,161,242,0.95)','#1da1f2','🔥 SHARE ON X 🔥',30,true);
  endBtns.mint={x:28,y:606,w:VW-56,h:54}; ctaBtn(endBtns.mint,'rgba(249,200,14,0.28)','#f9c80e','🐱 CUTIE KITTIES — FREE MINT LIVE',20,true);
  endBtns.quant={x:28,y:676,w:VW-56,h:50}; ctaBtn(endBtns.quant,'rgba(22,199,132,0.24)','#16c784','📈 PUSHING QUANT',20);
  endBtns.os={x:28,y:742,w:VW-56,h:46}; linkBtn(endBtns.os,'#ff9a9a','JPEG JOKERS: MAX FREE MINTS',17);
  ctx.fillStyle=`rgba(159,179,200,${0.6+0.4*Math.sin(now/400)})`; ctx.font='900 17px '+F; ctx.textAlign='center'; ctx.fillText('🔄 refresh the page to play again',VW/2,824);
}
function handleEndClick(x,y){ const hit=b=>b&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
  if(hit(endBtns.share)) shareNow();
  else if(hit(endBtns.mint)) window.open(CONFIG.LINKS.mint,'_blank');
  else if(hit(endBtns.quant)) window.open(CONFIG.LINKS.quant,'_blank');
  else if(hit(endBtns.os)) window.open(CONFIG.LINKS.opensea,'_blank');
}

/* ---------------- Loop ---------------- */
function frame(t){ const dt=Math.min(0.033,(t-last)/1000)||0; last=t;
  if(state==='play') update(dt);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,VW,VH);
  if(state==='title'){ drawTitle(); requestAnimationFrame(frame); return; }
  if(state==='over'){ drawOver(); requestAnimationFrame(frame); return; }
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawAlley(); drawCustomer(); drawChar(); drawHUD(); drawButtons();
  if(jimT>0) drawJimothy();
  if(fbiActive){ ctx.setTransform(1,0,0,1,0,0); drawFBI(); }
  if(copScratch>0){ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=`rgba(234,57,67,${copScratch*0.5})`; ctx.fillRect(0,0,VW,VH); }
  requestAnimationFrame(frame);
}
reset(); state='title';
requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) Sound.stopMusic(); else if(state==='play') Sound.startMusic(); });
</script>
