name: Weekly holder snapshot
on:
  schedule: [{ cron: "5 0 * * 0" }]   # Sundays 00:05 UTC
  workflow_dispatch: { inputs: { chain: { description: "chain id", default: "8453" } } }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --legacy-peer-deps
      - run: node --experimental-strip-types scripts/snapshot.mjs --chain ${{ github.event.inputs.chain || '8453' }}
        env:
          BASE_RPC: ${{ secrets.BASE_RPC }}
          ROBINHOOD_RPC: ${{ secrets.ROBINHOOD_RPC }}
          NEXT_PUBLIC_FACTORY_8453: ${{ vars.NEXT_PUBLIC_FACTORY_8453 }}
          NEXT_PUBLIC_FACTORY_4663: ${{ vars.NEXT_PUBLIC_FACTORY_4663 }}
          NEXT_PUBLIC_DISTRIBUTOR_8453: ${{ vars.NEXT_PUBLIC_DISTRIBUTOR_8453 }}
          NEXT_PUBLIC_DISTRIBUTOR_4663: ${{ vars.NEXT_PUBLIC_DISTRIBUTOR_4663 }}
      - uses: peter-evans/create-pull-request@v6
        with:
          title: "Weekly holder rewards epoch"
          commit-message: "Add weekly holder rewards epoch"
          branch: epochs/auto
          body: "Snapshot generated by the weekly job. Review, publish the root from the stakers pool wallet, then merge."
